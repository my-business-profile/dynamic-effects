name: Import RK Fitness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-rk-fitness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Copy public RK Fitness site
        shell: bash
        run: |
          rm -rf rk-fitness
          git clone --depth 1 https://github.com/yashveer-singh-55/R.K.-FITNESS-AND-SPORTS.git /tmp/rk-fitness
          mkdir -p rk-fitness
          cp -a /tmp/rk-fitness/. rk-fitness/
          rm -rf rk-fitness/.git

      - name: Fix Services page stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("rk-fitness/services.html")
          s = p.read_text()
          marker = '<link rel="stylesheet" href="style.css">'
          extra = '<link rel="stylesheet" href="services.css">'
          if extra not in s:
              s = s.replace(marker, marker + "\n    " + extra, 1)
          p.write_text(s)
          PY

      - name: Commit imported site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rk-fitness
          if git diff --cached --quiet; then
            echo "No import changes."
            exit 0
          fi
          git commit -m "Import R.K. Fitness and Sports site and fix services page"
          git push

      - name: Remove one-time importer
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/import-rk-fitness.yml
          git add -u .github/workflows/import-rk-fitness.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove one-time RK Fitness importer"
          git push
